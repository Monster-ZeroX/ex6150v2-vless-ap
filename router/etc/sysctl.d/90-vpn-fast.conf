# EX6150v2 VLESS AP: faster ramp-up of tunnelled TCP connections.
# Router defaults start each socket with a 16 KB send / 128 KB receive buffer, which throttles
# the first seconds of every new connection (exactly what a speed test measures) and causes
# zero-window stalls and receive-queue collapsing. Measured: +13% in the first 2 s.
net.ipv4.tcp_rmem = 4096 262144 4194304
net.ipv4.tcp_wmem = 4096 131072 4194304
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
net.ipv4.tcp_slow_start_after_idle = 0
